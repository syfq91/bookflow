<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}BookFlow{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('admin.dashboard') }}">BookFlow</a>
      <nav>
        {% if session.get('admin') %}
        <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin.folders') }}">Library</a>
        <a href="{{ url_for('admin.health') }}">Health</a>
        <form class="inline" method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <button type="submit" class="link-button">Log out</button>
        </form>
        {% endif %}
      </nav>
    </header>

    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <p class="flash flash-{{ category }}">{{ message }}</p>
      {% endfor %}
      {% endwith %} {% block content %}{% endblock %}
    </main>
  </body>
</html>
