{% extends "layout.html" %}

{% block title %}Add user · BookFlow{% endblock %}

{% block content %}
<section class="card narrow">
  <h1>Add user account</h1>
  <p class="muted">
    Reader accounts can access OPDS feeds and sync reading progress. Administrators also have access to this dashboard.
  </p>
  {% if error %}
  <p class="error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('admin.user_create') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      value="{{ username }}"
      placeholder="e.g. reader1"
      required
      autofocus
    />
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Minimum 8 characters"
      required
      minlength="8"
    />
    <div style="margin-top: 1rem; display: flex; align-items: center; gap: 0.5rem;">
      <input
        id="is_admin"
        name="is_admin"
        type="checkbox"
        value="true"
        {% if is_admin_checked %}checked{% endif %}
      />
      <label for="is_admin" style="margin: 0; cursor: pointer;">Administrator privileges</label>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('admin.users') }}">Cancel</a>
      <button type="submit">Create User</button>
    </div>
  </form>
</section>
{% endblock %}
