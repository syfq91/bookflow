name: bookflow

services:
  bookflow:
    build: .
    image: bookflow:latest
    container_name: bookflow
    # Host bind/port: localhost only. Use "0.0.0.0:8000:8000" for LAN.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Required: without it OPDS returns 503 and admin login is locked.
      OPDS_ADMIN_PASSWORD: change-me
      # OPDS_ADMIN_USERNAME: admin
      # OPDS_DATA_DIR: ./data            # /app/data is the named volume
      # OPDS_DATABASE_URL: sqlite+pysqlite:////app/data/bookflow.db
      # OPDS_SESSION_SECRET: change-me   # empty → generated on first start
      # OPDS_SESSION_COOKIE_SECURE: "false"   # "true" behind HTTPS
      # OPDS_SCAN_EXTENSIONS: .epub,.pdf,.cbz,.cbr,.mobi,.azw3
      # GUNICORN_WORKERS: "2"
    volumes:
      - bookflow-data:/app/data
      #- ./library:/library:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  bookflow-data:
