name: bookflow

services:
  bookflow:
    build: .
    image: bookflow:latest
    container_name: bookflow
    ports:
      - "${BOOKFLOW_BIND:-127.0.0.1}:${BOOKFLOW_PORT:-8000}:8000"
    # Optional: forwards every OPDS_* / GUNICORN_WORKERS value from .env.
    # Without a .env file the app's own defaults apply (see .env.example);
    # the default data dir ./data resolves to /app/data (the named volume).
    env_file:
      - path: .env
        required: false
    volumes:
      - bookflow-data:/app/data
      - ${LIBRARY_DIR:-./library}:/library:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  bookflow-data:
